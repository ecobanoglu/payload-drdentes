# Yerel geliştirme için PostgreSQL.
# Başlatma:  docker compose up -d
# .env:      DATABASE_URL=postgresql://postgres:postgres@localhost:5432/payload-drdentes
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payload-drdentes
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
